services:
  web:
    image: ghcr.io/marcel-b/module-o-mat:${IMAGE_TAG:-latest}
    build: .
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-https}
      # Public URL port (e.g. 80/443 behind NPM). Falls back to host-mapped PORT.
      PHX_PORT: ${PHX_PORT:-${PORT:-4000}}
      # Optional: comma-separated Origins if hostname and IP:PORT both serve the app
      PHX_CHECK_ORIGIN: ${PHX_CHECK_ORIGIN:-}
      # Optional: redirect HTTP→HTTPS via X-Forwarded-Proto (TLS at the proxy)
      PHX_FORCE_SSL: ${PHX_FORCE_SSL:-false}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set}
      PORT: "4000"
      DATABASE_PATH: /data/module_o_mat.db
      MANUAL_UPLOADS_DIR: /data/uploads/manuals
    volumes:
      - module_o_mat_data:/data
    restart: unless-stopped

volumes:
  module_o_mat_data:

<!doctype html>
<html lang="de" class="min-h-full font-sans antialiased scheme-light dark:scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModuleOMat</title>
    <script>
      (() => {
        const key = 'module-o-mat:theme'
        const stored = localStorage.getItem(key) || 'system'
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        const theme = stored === 'system' ? system : stored
        document.documentElement.classList.toggle('p-dark', theme === 'dark')
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body class="m-0 min-h-full bg-surface-50 text-surface-900 dark:bg-[#0f1218]">
    <div id="app" class="min-h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

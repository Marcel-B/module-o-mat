name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: Vue UI bauen & testen
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dotnet/src/ModuleOMat.Api/ClientApp

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dotnet/src/ModuleOMat.Api/ClientApp/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Typen pruefen
        run: npm run typecheck

      - name: Tests ausfuehren
        run: npm test

      - name: Produktions-Build
        run: npm run build

  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dotnet
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Wiederherstellen, bauen und testen
        run: |
          dotnet restore
          dotnet build --no-restore --warnaserror
          dotnet test --no-build --verbosity normal

  docker-dotnet:
    name: .NET Docker Image nach GHCR
    needs: [dotnet, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Image-Namen (Kleinbuchstaben) setzen
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/module-o-mat-dotnet" >> "$GITHUB_ENV"

      - name: Image-Tags ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dotnet/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
